version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./.env
    networks:
      - pay-first-network
  redis:
    image: redis:8.2.3
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pay-first-network
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pay-first-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: pay-first-web-app
    build: .
    command: gunicorn root.wsgi:application --config gunicorn.conf.py
    restart: unless-stopped
    volumes:
      - .:/app
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./.env
    networks:
      - pay-first-network

  worker:
    build: .
    command: python -m celery -A root worker -l info
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      - rabbitmq
      - redis
    networks:
      - pay-first-network
  celery-beat:
    build: .
    command: python -m celery -A root beat -l info
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      - rabbitmq
      - redis
    networks:
      - pay-first-network

volumes:
  postgres_data:
networks:
  pay-first-network:
